name: Deploy Next.js to Staging VPS
on:
  push:
    branches:
      - development
      - dev-daffa
jobs:
  deploy:
    name: Deploy to Staging VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            echo "📁 Masuk ke direktori project..."
            cd ~/staging-apex-record/frontend/apex-record

            echo "🔀 Pastikan di branch ${{ github.ref_name }}..."
            git fetch origin ${{ github.ref_name }}
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            echo "📦 Cek perubahan dependency..."
            CURRENT_HASH=$(sha256sum package-lock.json | awk '{print $1}')
            PREVIOUS_HASH=$(cat .last-lock-hash 2>/dev/null || echo "none")

            if [ "$CURRENT_HASH" != "$PREVIOUS_HASH" ]; then
              echo "📦 Dependency berubah, install ulang..."
              npm install --prefer-offline --no-audit --no-fund
              echo "$CURRENT_HASH" > .last-lock-hash
            else
              echo "📦 Tidak ada perubahan dependency, skip install ✅"
            fi

            echo "🔨 Build project..."
            npm run build

            echo "♻️  Restart PM2..."
            pm2 restart apex-record-staging-frontend

            echo "✅ Deploy selesai!"
