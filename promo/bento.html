<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ApexRecord Bento</title>
<style>
  @font-face { font-family: 'Inter'; font-weight: 400; src: url(fonts/Inter-400.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 500; src: url(fonts/Inter-500.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 600; src: url(fonts/Inter-600.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 700; src: url(fonts/Inter-700.woff2) format('woff2'); }
  @font-face { font-family: 'Inter Tight'; font-weight: 600; src: url(fonts/InterTight-600.woff2) format('woff2'); }
  @font-face { font-family: 'Inter Tight'; font-weight: 700; src: url(fonts/InterTight-700.woff2) format('woff2'); }
  @font-face { font-family: 'Inter Tight'; font-weight: 800; src: url(fonts/InterTight-800.woff2) format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 500; src: url(fonts/JetBrainsMono-500.woff2) format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 600; src: url(fonts/JetBrainsMono-600.woff2) format('woff2'); }

  /* Token warna mengikuti app/landingpage/landingpage.css */
  :root {
    --bg: #EEECE6; --surface: #FFFFFF; --soft: #FAF9F6;
    --ink: #17160F; --ink-2: #55534A; --ink-3: #8D8B7E;
    --line: rgba(23,22,15,.08); --line-strong: rgba(23,22,15,.14);
    --accent: #3E8E36; --lime: #7ED957; --accent-soft: #E3F3DA; --accent-ink: #2B6B22;
    --warn-soft: #FCEACB; --warn-ink: #8A5A00; --danger-soft: #FBE1DE; --danger-ink: #C1381F;
    --info-soft: #DCEAFB; --info-ink: #1D5FAE;
    --grid-line: rgba(23,22,15,.05);
    --shadow: 0 1px 2px rgba(23,22,15,.04), 0 24px 48px -28px rgba(23,22,15,.28);
    --display: 'Inter Tight', sans-serif; --sans: 'Inter', sans-serif; --mono: 'JetBrains Mono', monospace;
  }
  body.dark {
    --bg: #17160F; --surface: #242320; --soft: #1D1C17;
    --ink: #F3F1EA; --ink-2: #B8B5A9; --ink-3: #85826F;
    --line: rgba(255,255,255,.08); --line-strong: rgba(255,255,255,.14);
    --accent: #6BC85F; --accent-soft: #23361F; --accent-ink: #6BC85F;
    --warn-soft: #3A2C10; --warn-ink: #E8A930; --danger-soft: #3A1F17; --danger-ink: #E5573C;
    --info-soft: #1B2A3A; --info-ink: #5B9BE0;
    --grid-line: rgba(255,255,255,.045);
    --shadow: 0 30px 60px -30px rgba(0,0,0,.7);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; overflow: hidden; }

  .slide {
    width: 1920px; height: 1080px; position: relative; overflow: hidden;
    padding: 52px 64px 44px; display: flex; flex-direction: column; gap: 30px;
  }
  .bg-grid {
    position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse 70% 60% at 20% 0%, #000 30%, transparent 100%);
  }
  .glow { position: absolute; width: 1100px; height: 1100px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(126,217,87,.22), transparent 62%); }
  body:not(.dark) .glow { opacity: .55; }
  .z { position: relative; }

  /* top & bottom bar */
  .top, .bottom { position: relative; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 46px; height: 46px; background: url(logo.png) center/152% no-repeat; }
  .dark .logo { background-color: #F3F1EA; border-radius: 13px; background-size: 118%; }
  .word { font-family: var(--display); font-weight: 700; font-size: 25px; letter-spacing: -.01em; }
  .word em { font-style: normal; color: var(--accent); }
  .dark .word em { color: var(--lime); }
  .kicker { font-family: var(--mono); font-size: 14px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  .bottom { border-top: 1px solid var(--line-strong); padding-top: 18px; }
  .foot { font-family: var(--mono); font-size: 15px; color: var(--ink-2); }

  /* bento */
  .bento {
    position: relative; flex: 1; min-height: 0; display: grid; gap: 20px;
    grid-template-columns: repeat(12, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr));
  }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 26px; box-shadow: var(--shadow);
    padding: 26px 28px; display: flex; flex-direction: column; gap: 14px; min-width: 0; min-height: 0; overflow: hidden; position: relative;
  }
  .eyebrow { font-family: var(--mono); font-size: 12.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 8px; }
  .dark .eyebrow { color: var(--lime); }
  .ttl { font-family: var(--display); font-weight: 700; font-size: 27px; line-height: 1.12; letter-spacing: -.018em; }
  .ttl.sm { font-size: 22px; }
  .sub { font-size: 14.5px; line-height: 1.5; color: var(--ink-2); }
  .sp { flex: 1; min-height: 0; }
  .row { display: flex; align-items: center; }
  .mono { font-family: var(--mono); }

  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .chip.ok { background: var(--accent-soft); color: var(--accent-ink); }
  .chip.warn { background: var(--warn-soft); color: var(--warn-ink); }
  .chip.bad { background: var(--danger-soft); color: var(--danger-ink); }
  .chip.info { background: var(--info-soft); color: var(--info-ink); }
  .chip.line { border: 1px solid var(--line-strong); color: var(--ink-2); background: var(--surface); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  /* hero text block (tanpa card) */
  .hero { display: flex; flex-direction: column; justify-content: center; padding-right: 24px; }
  .pill { align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px 8px 12px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line-strong); font-size: 14px; font-weight: 600; color: var(--ink-2); box-shadow: var(--shadow); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 4px rgba(126,217,87,.25); }
  h1 { font-family: var(--display); font-weight: 800; font-size: 66px; line-height: 1.02; letter-spacing: -.028em; margin-top: 22px; }
  .hl { white-space: nowrap; background: linear-gradient(transparent 62%, var(--lime) 62%, var(--lime) 92%, transparent 92%); padding: 0 6px; margin: 0 -6px; }
  .dark .hl { background: none; color: var(--lime); padding: 0; margin: 0; }
  .lead { font-size: 19px; line-height: 1.5; color: var(--ink-2); margin-top: 18px; max-width: 640px; }
  .trust { display: flex; gap: 22px; margin-top: 22px; flex-wrap: wrap; }
  .trust span { display: flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 500; color: var(--ink-2); }
  .trust svg { color: var(--accent); }
  .dark .trust svg { color: var(--lime); }

  /* list rows */
  .lrow { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 14px; background: var(--soft); border: 1px solid var(--line); }
  .lrow + .lrow { margin-top: 8px; }
  .av { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; font-family: var(--mono); font-size: 12px; font-weight: 600; background: var(--accent-soft); color: var(--accent-ink); flex-shrink: 0; }
  .who { flex: 1; min-width: 0; }
  .who b { display: block; font-size: 15px; font-weight: 600; }
  .who em { display: block; font-style: normal; font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
  .amt { font-family: var(--mono); font-size: 14px; font-weight: 600; }

  /* diagnosis */
  .search { display: flex; align-items: center; gap: 12px; background: var(--soft); border: 2px solid var(--accent); border-radius: 14px; padding: 13px 16px; box-shadow: 0 0 0 5px rgba(126,217,87,.2); font-size: 17px; font-weight: 500; }
  .caret { display: inline-block; width: 2px; height: 20px; background: var(--accent); margin-left: 2px; vertical-align: -4px; }
  .dx { display: flex; align-items: center; gap: 16px; padding: 12px 12px; border-bottom: 1px solid var(--line); }
  .dx:last-child { border-bottom: none; }
  .dx.on { background: var(--accent-soft); border-radius: 12px; border-bottom-color: transparent; }
  .code { font-family: var(--mono); font-size: 13.5px; font-weight: 600; min-width: 74px; padding: 4px 8px; border-radius: 7px; text-align: center; background: var(--info-soft); color: var(--info-ink); }
  .code.sn { background: var(--accent-soft); color: var(--accent-ink); }
  .dx b { display: block; font-size: 15px; font-weight: 600; }
  .dx small { display: block; font-size: 12px; color: var(--ink-3); margin-top: 2px; }

  /* odontogram */
  .odo { display: flex; flex-direction: column; gap: 6px; }
  .jaw { display: grid; grid-template-columns: repeat(16, 1fr); gap: 4px; }
  .jaw.mid { border-bottom: 1.5px dashed var(--line-strong); padding-bottom: 8px; margin-bottom: 2px; }
  .tooth { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .tooth i { width: 100%; aspect-ratio: 1; border-radius: 6px; border: 1.5px solid var(--line-strong); background: var(--soft); position: relative; display: block; }
  .tooth i::after { content: ''; position: absolute; inset: 28%; border-radius: 2px; border: 1.2px solid var(--line-strong); }
  .tooth span { font-family: var(--mono); font-size: 9.5px; color: var(--ink-3); }
  .tooth.car i { background: var(--danger-soft); border-color: var(--danger-ink); }
  .tooth.car i::after { background: var(--danger-ink); border-color: var(--danger-ink); }
  .tooth.fill i { background: var(--accent-soft); border-color: var(--accent); }
  .tooth.fill i::after { background: var(--lime); border-color: var(--accent); }
  .tooth.miss i { background: transparent; border-style: dashed; }
  .tooth.miss i::after { inset: 18%; border: none; background:
    linear-gradient(45deg, transparent 45%, var(--ink-3) 45%, var(--ink-3) 55%, transparent 55%),
    linear-gradient(-45deg, transparent 45%, var(--ink-3) 45%, var(--ink-3) 55%, transparent 55%); }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 11px; height: 11px; border-radius: 3px; display: block; }

  /* stok */
  .flow { display: grid; grid-template-columns: 0.9fr auto 1.4fr; gap: 16px; align-items: center; }
  .items { display: flex; flex-direction: column; gap: 6px; }
  .item { display: flex; justify-content: space-between; font-size: 13.5px; padding: 7px 12px; border-radius: 10px; background: var(--soft); border: 1px solid var(--line); }
  .item .mono { color: var(--danger-ink); font-weight: 600; font-size: 13px; }

  /* signature */
  .sig { flex: 1; min-height: 0; border: 1.5px dashed var(--line-strong); border-radius: 14px; background: var(--soft); position: relative; }
  .sig svg { position: absolute; left: 18px; top: 8px; width: calc(100% - 36px); height: calc(100% - 34px); }
  .sig small { position: absolute; left: 14px; bottom: 8px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); }

  /* heatmap */
  .heat { display: grid; grid-template-columns: 34px repeat(12, 1fr); gap: 5px; align-items: center; }
  .heat i { aspect-ratio: 1.35; border-radius: 5px; display: block; background: rgba(62,142,54,var(--o)); }
  .dark .heat i { background: rgba(126,217,87,var(--o)); }
  .heat span { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .kpi { background: var(--soft); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .kpi .k { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); margin-bottom: 6px; }
  .kpi .v { font-family: var(--display); font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
  .kpi .v.g { color: var(--accent); }
  .dark .kpi .v.g { color: var(--lime); }
  .banner { font-size: 13.5px; line-height: 1.5; color: var(--accent-ink); background: var(--accent-soft); border-radius: 12px; padding: 11px 14px; }

  /* tabel tarif */
  .tbl { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  .tbl th { text-align: right; font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); padding: 0 12px 10px; }
  .tbl th:first-child, .tbl td:first-child { text-align: left; padding-left: 0; }
  .tbl td { text-align: right; padding: 11px 12px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 13.5px; color: var(--ink-2); }
  .tbl td:first-child { font-family: var(--sans); font-size: 15px; font-weight: 600; color: var(--ink); }
  .tbl td:last-child, .tbl th:last-child { padding-right: 0; }

  /* cabang */
  .bar { height: 10px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); overflow: hidden; margin-top: 7px; }
  .bar i { display: block; height: 100%; border-radius: 999px; background: var(--lime); }
  .branch { font-size: 14px; }
  .branch .row { justify-content: space-between; }
  .branch b { font-weight: 600; }

  /* api */
  .code-card { background: #17160F; color: #E9E6DC; border-color: rgba(255,255,255,.08); }
  .dark .code-card { background: #0E0D09; }
  .code-card .eyebrow { color: var(--lime); }
  .code-card pre { font-family: var(--mono); font-size: 13.5px; line-height: 1.75; white-space: pre; }
  .code-card .c { color: #A09D8B; } .code-card .k { color: #7ED957; } .code-card .s { color: #E8C27A; }
  .usage { background: rgba(255,255,255,.06); border-radius: 12px; padding: 10px 14px; }
  .usage .row { justify-content: space-between; font-size: 12px; color: rgba(255,255,255,.6); margin-bottom: 7px; }
  .usage b { color: #fff; font-family: var(--mono); font-weight: 600; }
  .usage .bar { background: rgba(255,255,255,.1); border: none; height: 6px; margin: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script>
const I = {
  check: '<polyline points="20 6 9 17 4 12"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  arrow: '<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>',
  alert: '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
  lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  wa: '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>',
  sync: '<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>',
};
const ic = (n, s = '') => `<svg class="i" viewBox="0 0 24 24" style="${s}">${I[n]}</svg>`;

const tooth = (n, st = '') => `<div class="tooth ${st}"><span>${n}</span><i></i></div>`;
const toothB = (n, st = '') => `<div class="tooth ${st}"><i></i><span>${n}</span></div>`;
const upper = [18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28];
const lower = [48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];
const odoState = { 16: 'fill', 26: 'car', 18: 'miss', 36: 'car', 46: 'fill', 47: 'fill', 38: 'miss', 24: 'fill' };

// Heatmap: intensitas kunjungan Sen–Sab × jam 08–19 (data ilustrasi)
const heatRows = [
  ['Sen', [.10,.18,.22,.16,.12,.14,.22,.30,.42,.55,.46,.24]],
  ['Sel', [.08,.14,.20,.18,.10,.12,.18,.26,.38,.50,.40,.20]],
  ['Rab', [.12,.20,.26,.20,.14,.16,.24,.34,.48,.62,.52,.28]],
  ['Kam', [.14,.22,.30,.24,.16,.18,.28,.40,.62,.95,.70,.34]],
  ['Jum', [.10,.16,.18,.12,.06,.10,.20,.30,.44,.58,.48,.22]],
  ['Sab', [.30,.46,.62,.70,.54,.40,.34,.30,.26,.22,.16,.10]],
];

const topBar = (kicker) => `
  <div class="top"><div class="brand"><div class="logo"></div><div class="word">Apex<em>Record</em></div></div><span class="kicker">${kicker}</span></div>`;
const bottom = (right) => `
  <div class="bottom"><span class="foot">apexrecord.my.id</span><span class="foot">${right}</span></div>`;

const SLIDES = {
  // ================= 01 · REKAM MEDIS & OPERASIONAL HARIAN =================
  klinis: () => `
  <section class="slide">
    <div class="bg-grid"></div>
    <div class="glow" style="left:-520px;top:-560px"></div>
    ${topBar('01 · Rekam Medis &amp; Operasional')}
    <div class="bento">

      <div class="hero z" style="grid-column:1/6;grid-row:1/3">
        <span class="pill"><span class="dot"></span>Klinik Pratama · Klinik Utama · TPMD · TPMDG</span>
        <h1>Kelola klinik &amp; praktik Anda tanpa <span class="hl">drama administrasi.</span></h1>
        <p class="lead">Dari pasien datang, diperiksa, bayar, sampai laporan ke akuntan — semua dalam satu platform.</p>
        <div class="trust">
          <span>${ic('check')}15 hari gratis</span><span>${ic('check')}Setup aktif &lt; 10 menit</span><span>${ic('check')}Terhubung SATUSEHAT</span>
        </div>
      </div>

      <div class="card" style="grid-column:6/10;grid-row:1/4">
        <span class="eyebrow">Diagnosis · ICD-10 &amp; SNOMED CT</span>
        <div class="ttl">Ga perlu hafal kode. Cukup ketik seperti bicara.</div>
        <div class="sp"></div>
        <div class="search">${ic('search', 'color:var(--ink-3)')}<span>gigi berlubang<span class="caret"></span></span></div>
        <div>
          <div class="dx on"><span class="code">K02.1</span><div style="flex:1"><b>Karies dentin</b><small>Caries of dentine · ICD-10</small></div><span class="chip ok">Pilih ↵</span></div>
          <div class="dx"><span class="code">K02.0</span><div><b>Karies terbatas pada email</b><small>Caries limited to enamel · ICD-10</small></div></div>
          <div class="dx"><span class="code">K02.9</span><div><b>Karies gigi, tidak spesifik</b><small>Dental caries, unspecified · ICD-10</small></div></div>
          <div class="dx"><span class="code sn">80967001</span><div><b>Dental caries</b><small>Padanan SNOMED CT</small></div></div>
        </div>
        <div class="sp"></div>
        <div class="chips"><span class="chip ok">18.500+ kode ICD-10</span><span class="chip ok">499.000+ konsep SNOMED CT</span><span class="chip info">Catatan SOAP</span></div>
      </div>

      <div class="card" style="grid-column:10/13;grid-row:1/3">
        <span class="eyebrow">Odontogram</span>
        <div class="ttl sm">Catatan per gigi, bukan per kertas.</div>
        <div class="sp"></div>
        <div class="odo">
          <div class="jaw mid">${upper.map((n) => tooth(n, odoState[n])).join('')}</div>
          <div class="jaw">${lower.map((n) => toothB(n, odoState[n])).join('')}</div>
        </div>
        <div class="legend">
          <span><i style="background:var(--danger-ink)"></i>Karies</span>
          <span><i style="background:var(--lime)"></i>Tambalan</span>
          <span><i style="border:1.5px dashed var(--ink-3)"></i>Hilang</span>
        </div>
      </div>

      <div class="card" style="grid-column:1/6;grid-row:3/5">
        <div class="row" style="justify-content:space-between">
          <span class="eyebrow">Reservasi &amp; Antrian Online</span>
          <span class="chip line">${ic('wa', 'width:14px;height:14px')}Cek status via WhatsApp</span>
        </div>
        <div class="ttl">Booking dari website klinik, slot ikut jadwal dokter.</div>
        <div class="sp"></div>
        <div>
