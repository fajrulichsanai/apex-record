<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ApexRecord Bento</title>
<style>
  @font-face {
    font-family: 'Inter'; font-style: normal; font-weight: 100 900; font-display: block;
    src: url(fonts/inter-latin.woff2) format('woff2');
  }
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --ink: #1d1d1f;
    --muted: #6e6e73;
    --line: rgba(0, 0, 0, 0.07);
    --chip: #f2f2f5;
    --blue: #4f7ef8;
    --blue-dk: #3b6ce6;
    --indigo: #5e5cf0;
    --green: #22b35e;
    --purple: #a855f7;
    --orange: #ff8a00;
    --pink: #ff375f;
    --teal: #14b8c4;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
    --r: 30px;
    --gap: 18px;
    --pad: 48px;
  }
  body.dark {
    --bg: #000000;
    --card: #141416;
    --ink: #f5f5f7;
    --muted: #8e8e93;
    --line: rgba(255, 255, 255, 0.08);
    --chip: #232326;
    --shadow: none;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .canvas {
    width: var(--w); height: var(--h);
    padding: var(--pad);
    display: flex; flex-direction: column; gap: 28px;
    position: relative; overflow: hidden;
  }
  .ambient {
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(600px 400px at 10% 0%, rgba(79,126,248,.12), transparent 70%),
      radial-gradient(500px 400px at 100% 100%, rgba(168,85,247,.10), transparent 70%);
  }
  body.dark .ambient {
    background:
      radial-gradient(700px 500px at 5% 0%, rgba(79,126,248,.22), transparent 70%),
      radial-gradient(600px 500px at 100% 100%, rgba(168,85,247,.16), transparent 70%);
  }

  /* ---------- Header (portrait) ---------- */
  .header { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 22px; letter-spacing: -.01em; }
  .mark {
    width: 40px; height: 40px; border-radius: 12px; color: #fff;
    background: linear-gradient(135deg, #7ea2ff, var(--blue) 55%, var(--indigo));
    display: grid; place-items: center; box-shadow: 0 6px 18px rgba(79,126,248,.35);
  }
  .mark svg { width: 22px; height: 22px; }
  .header h1 { font-size: 64px; line-height: 1.02; font-weight: 800; letter-spacing: -.045em; }
  .header p { font-size: 22px; color: var(--muted); letter-spacing: -.01em; max-width: 820px; }
  .grad-text {
    background: linear-gradient(90deg, var(--blue), var(--indigo) 50%, var(--purple));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* ---------- Grid ---------- */
  .bento {
    position: relative; z-index: 1; flex: 1; min-height: 0;
    display: grid; gap: var(--gap);
    grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
    grid-template-rows: var(--row-tpl);
  }
  .tile {
    background: var(--card); border-radius: var(--r); box-shadow: var(--shadow);
    padding: 26px; position: relative; overflow: hidden;
    display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0;
    border: 1px solid var(--line);
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 600; letter-spacing: .01em; color: var(--accent, var(--blue));
  }
  .eyebrow svg { width: 18px; height: 18px; }
  .title { font-size: 28px; line-height: 1.1; font-weight: 700; letter-spacing: -.03em; }
  .desc { font-size: 15px; line-height: 1.45; color: var(--muted); }
  .grow { flex: 1; min-height: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--chip); border-radius: 999px; padding: 7px 12px;
    font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap;
  }
  .chip svg { width: 14px; height: 14px; }
  .chip.accent { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
  svg.i { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .big { font-weight: 800; letter-spacing: -.045em; line-height: 1; }

  /* hero */
  .t-hero {
    background: linear-gradient(150deg, #6f95ff 0%, var(--blue) 35%, var(--indigo) 75%, #7c3aed 100%);
    color: #fff; border: none; justify-content: space-between; padding: 34px;
  }
  .t-hero .glow { position: absolute; border-radius: 50%; filter: blur(10px); opacity: .5; }
  .t-hero .g1 { width: 320px; height: 320px; right: -90px; top: -90px; background: radial-gradient(circle, rgba(255,255,255,.55), transparent 65%); }
  .t-hero .g2 { width: 260px; height: 260px; left: -80px; bottom: -110px; background: radial-gradient(circle, rgba(168,85,247,.9), transparent 65%); }
  .t-hero .brand { position: relative; }
  .t-hero .mark { background: rgba(255,255,255,.2); box-shadow: inset 0 0 0 1px rgba(255,255,255,.35); backdrop-filter: blur(6px); }
  .t-hero h2 { position: relative; font-size: 58px; line-height: 1.02; font-weight: 800; letter-spacing: -.045em; }
  .t-hero p { position: relative; font-size: 17px; line-height: 1.45; color: rgba(255,255,255,.82); max-width: 440px; }
  .t-hero .ver { position: relative; font-size: 13px; font-weight: 600; opacity: .75; }

  /* satusehat */
  .t-sat { --accent: var(--green); }
  .sync-list { display: flex; flex-direction: column; gap: 10px; }
  .sync-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    background: var(--chip); border-radius: 16px;
  }
  .avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0; }
  .sync-row .who { flex: 1; min-width: 0; }
  .sync-row .who b { display: block; font-size: 14px; font-weight: 600; }
  .sync-row .who span { font-size: 12px; color: var(--muted); }
  .pill { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
  .pill svg { width: 12px; height: 12px; stroke-width: 3; }
  .pill.ok { background: rgba(34,179,94,.14); color: var(--green); }
  .pill.wait { background: rgba(255,138,0,.14); color: var(--orange); }
  .sat-badge {
    display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); font-weight: 500;
  }
  .sat-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(34,179,94,.18); }

  /* dashboard */
  .t-dash { --accent: var(--blue); }
  .stats { display: grid; grid-template-columns: repeat(var(--stat-cols, 2), 1fr); grid-auto-rows: 1fr; gap: 10px; flex: 1; min-height: 0; margin-top: 6px; }
  .stat { background: var(--chip); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
  .stat .lbl { font-size: 12px; color: var(--muted); font-weight: 500; }
  .stat .val { font-size: 28px; font-weight: 800; letter-spacing: -.04em; }
  .stat .val small { font-size: 16px; font-weight: 700; letter-spacing: -.02em; }
  .stat .delta { font-size: 12px; font-weight: 700; color: var(--green); }

  /* pasien */
  .t-pas { --accent: var(--purple); }
  .stepper { display: flex; align-items: flex-start; gap: 0; }
  .step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; }
  .step::before {
    content: ''; position: absolute; top: 17px; left: -50%; width: 100%; height: 3px;
    background: var(--chip); z-index: 0;
  }
  .step:first-child::before { display: none; }
  .step.done::before, .step.now::before { background: var(--purple); }
  .step .n {
    position: relative; z-index: 1; width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center; font-size: 14px; font-weight: 700;
    background: var(--chip); color: var(--muted);
  }
  .step.done .n { background: var(--purple); color: #fff; }
  .step.done .n svg { width: 16px; height: 16px; stroke-width: 3; }
  .step.now .n { background: var(--card); color: var(--purple); box-shadow: inset 0 0 0 3px var(--purple); }
  .step .s { font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .step.done .s, .step.now .s { color: var(--ink); }

  /* reservasi */
  .t-res { --accent: var(--orange); }
  .sources { display: flex; gap: 10px; }
  .src { flex: 1; background: var(--chip); border-radius: 16px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
  .src svg { width: 22px; height: 22px; color: var(--orange); }

  /* billing */
  .t-bill { --accent: var(--teal); }
  .receipt { background: var(--chip); border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 9px; }
  .rline { display: flex; justify-content: space-between; font-size: 14px; gap: 10px; }
  .rline span:first-child { color: var(--muted); }
  .rline b { font-weight: 600; }
  .rline.disc b { color: var(--pink); }
  .rsep { border-top: 1.5px dashed var(--line); margin: 3px 0; }
  .rtotal { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 6px; }
  .rtotal .big { font-size: 30px; }
  .rtotal .lbl { font-size: 12px; color: var(--muted); font-weight: 600; display: block; margin-bottom: 4px; }

  /* laporan */
  .t-lap { --accent: var(--indigo); }
  .chart { position: relative; flex: 1; min-height: 0; }
  .chart svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .lap-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .lap-head .big { font-size: 34px; }
  .lap-head .delta { font-size: 13px; font-weight: 700; color: var(--green); }

  /* small tiles */
  .t-sm { justify-content: space-between; padding: 22px; gap: 8px; }
  .t-sm .ico {
    width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; color: #fff;
    background: var(--accent);
  }
  .t-sm .ico svg { width: 22px; height: 22px; }
  .t-sm .k { font-size: 15px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
  .t-sm .v { font-size: 13px; color: var(--muted); line-height: 1.35; }
  .t-sm .big { font-size: 36px; color: var(--accent); }
  .t-tarif { --accent: var(--pink); }
  .t-fee { --accent: var(--green); }
  .t-role { --accent: var(--blue); }
  .t-ops { --accent: var(--orange); }
  .t-res-sm { --accent: var(--orange); }
  .ring { width: 58px; height: 58px; }

  .footer {
    position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: center;
    font-size: 15px; color: var(--muted); font-weight: 500;
  }
  .footer b { color: var(--ink); font-weight: 700; }

  /* ---------- Format tweaks ---------- */
  body.f-ig-square { --pad: 40px; --gap: 16px; }
  body.f-ig-square .t-hero h2 { font-size: 50px; }
  body.f-ig-square .title { font-size: 24px; }
  body.f-ig-square .stat .val { font-size: 22px; }
  body.f-ig-square .stat { padding: 10px 12px; border-radius: 14px; }
  body.f-ig-square .step .s { font-size: 10.5px; }
  body.f-ig-square .step .n { width: 30px; height: 30px; font-size: 12px; }
  body.f-ig-square .step::before { top: 14px; }
  body.f-ig-square .tile { padding: 22px; }
  body.f-ig-square .rline { font-size: 12.5px; }
  body.f-ig-square .rtotal .big { font-size: 22px; }
  body.f-ig-square .receipt { padding: 12px 14px; gap: 7px; }

  body.f-desktop { --pad: 64px; --gap: 20px; --r: 34px; }
  body.f-desktop .t-hero h2 { font-size: 76px; }
  body.f-desktop .t-hero p { font-size: 20px; max-width: 520px; }
  body.f-desktop .title { font-size: 30px; }
  body.f-desktop .tile { padding: 28px; }
  body.f-desktop .t-sm .k { font-size: 20px; }
  body.f-desktop .t-sm .v { font-size: 15px; margin-top: 4px; }
  body.f-desktop .t-sm .big { font-size: 56px; }
  body.f-desktop .t-sm .ico { width: 50px; height: 50px; border-radius: 15px; }
  body.f-desktop .t-sm .ico svg { width: 26px; height: 26px; }
  body.f-desktop .rtotal .big { font-size: 26px; }
  body.f-desktop .rline { font-size: 13.5px; }
  body.f-desktop .stat .val { font-size: 38px; }
  body.f-desktop .stat .lbl { font-size: 13px; }
  body.f-ig-square .t-dash .stat .val { font-size: 30px; }
  body.f-desktop .t-bill .title, body.f-desktop .t-sat .title { font-size: 28px; }
  body.f-ig-portrait .header h1 { font-size: 66px; }
  body.f-ig-portrait .t-pas { gap: 8px; padding: 22px 26px; }
  body.f-ig-portrait .t-pas .title { font-size: 24px; }
  body.f-ig-portrait .stat { padding: 11px 14px; gap: 3px; }
  body.f-ig-portrait .stat .val { font-size: 24px; }
  body.f-ig-portrait .t-sm { padding: 20px; }
  body.f-ig-portrait .t-sm .big { font-size: 32px; }
  body.f-ig-square .lap-head .big { font-size: 26px; }
  body.f-ig-square .rline { flex-direction: column; gap: 0; }
  body.f-ig-square .rline span:first-child { font-size: 11.5px; }
  body.f-ig-square .rtotal .big { font-size: 22px; }
</style>
</head>
<body>
<div class="canvas" id="canvas">
  <div class="ambient"></div>
</div>

<script>
const I = {
  activity: '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>',
  users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
  card: '<rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/>',
  chart: '<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
  shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/>',
  dollar: '<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
  briefcase: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
  tag: '<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>',
  check: '<polyline points="20 6 9 17 4 12"/>',
  refresh: '<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
  grid: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>',
  globe: '<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
  monitor: '<rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>',
  phone: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>',
  user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
};
const ic = (n) => `<svg class="i" viewBox="0 0 24 24">${I[n]}</svg>`;

const T = {
  hero: () => `
    <div class="tile t-hero" style="grid-area:hero">
      <div class="glow g1"></div><div class="glow g2"></div>
      <div class="brand"><div class="mark">${ic('activity')}</div>ApexRecord</div>
      <div style="display:flex;flex-direction:column;gap:16px;position:relative">
        <h2>Kelola klinik<br>lebih cerdas.</h2>
        <p>Rekam medis, reservasi, kasir, hingga laporan keuangan — semua dalam satu platform.</p>
      </div>
    </div>`,

  sat: (v) => `
    <div class="tile t-sat" style="grid-area:sat">
      <span class="eyebrow">${ic('refresh')} Integrasi SATUSEHAT</span>
      <div class="title">Sinkron otomatis ke SATUSEHAT.</div>
      <div class="grow"></div>
      <div class="sync-list">
        ${[
          ['SR', 'Siti Rahma', 'Kunjungan · 09:12', '#a855f7', 1],
          ['BP', 'Budi Pratama', 'Kunjungan · 09:40', '#4f7ef8', 1],
          ...(v === 'short' ? [] : [['DK', 'Dimas Kurnia', 'Kunjungan · 10:21', '#14b8c4', 0]]),
        ].map(([a, n, t, c, ok]) => `
          <div class="sync-row">
            <div class="avatar" style="background:${c}">${a}</div>
            <div class="who"><b>${n}</b><span>${t}</span></div>
            ${ok ? `<span class="pill ok">${ic('check')} Terkirim</span>` : `<span class="pill wait">Mengirim…</span>`}
          </div>`).join('')}
      </div>
      <div class="sat-badge"><span class="dot"></span>Standar FHIR · Terhubung</div>
    </div>`,

  dash: (v) => `
    <div class="tile t-dash" style="grid-area:dash">
      <span class="eyebrow">${ic('grid')} Dashboard</span>
      <div class="title">Semua angka penting, sekilas.</div>
      <div class="stats">
        <div class="stat"><span class="lbl">Total Pasien</span><span class="val">2.481</span><span class="delta">▲ 12% bulan ini</span></div>
        <div class="stat"><span class="lbl">Kunjungan Hari Ini</span><span class="val">36</span><span class="delta">▲ 8 dari kemarin</span></div>
        <div class="stat"><span class="lbl">Pendapatan Bulan Ini</span><span class="val"><small>Rp</small>184,5<small>jt</small></span><span class="delta">▲ 18%</span></div>
        <div class="stat"><span class="lbl">Dokter Aktif</span><span class="val">6</span><span class="delta" style="color:var(--muted)">2 sedang praktik</span></div>
      </div>
      ${v === 'short' ? '' : `<div class="chips">
        <span class="chip accent">+ Pasien</span><span class="chip">+ Kunjungan</span><span class="chip">+ Reservasi</span><span class="chip">Input Transaksi</span>
      </div>`}
    </div>`,

  pas: (v) => `
    <div class="tile t-pas" style="grid-area:pas">
      <span class="eyebrow">${ic('users')} Data Pasien</span>
      <div class="title">Registrasi pasien 6 langkah, rapi & lengkap.</div>
      <div class="grow"></div>
      <div class="stepper">
        ${['Identitas', 'Alamat', 'Wali', 'Marketing', 'Medis', 'Preferensi'].map((s, i) => `
          <div class="step ${i < 3 ? 'done' : i === 3 ? 'now' : ''}">
            <div class="n">${i < 3 ? ic('check') : i + 1}</div><div class="s">${s}</div>
          </div>`).join('')}
      </div>
      ${v === 'short' ? '' : `<div class="grow"></div>
      <div class="chips">
        <span class="chip accent">Bayi tanpa NIK</span>
        <span class="chip">Catatan alergi</span>
        <span class="chip">Golongan darah</span>
      </div>`}
    </div>`,

  bill: (v) => `
    <div class="tile t-bill" style="grid-area:bill">
      <span class="eyebrow">${ic('card')} Billing & Kasir</span>
      <div class="title">Kasir cepat, tagihan akurat.</div>
      <div class="grow"></div>
      <div class="receipt">
        <div class="rline"><span>Scaling gigi</span><b>Rp350.000</b></div>
        <div class="rline"><span>Tambal komposit</span><b>Rp250.000</b></div>
        ${v === 'narrow' ? '' : '<div class="rline"><span>Biaya tambahan</span><b>Rp25.000</b></div>'}
        <div class="rline disc"><span>Diskon</span><b>${v === 'narrow' ? '−Rp50.000' : '−Rp75.000'}</b></div>
        <div class="rsep"></div>
        <div class="rtotal">
          <div><span class="lbl">Total Bayar</span><span class="big">Rp550.000</span></div>
          <span class="pill ok">${ic('check')} Lunas</span>
        </div>
      </div>
      <div class="chips">
        <span class="chip accent">Tunai</span><span class="chip">Transfer</span><span class="chip">Asuransi</span><span class="chip">BPJS</span>
      </div>
    </div>`,

  lap: () => {
    const data = [38, 52, 45, 61, 58, 72, 66, 80, 74, 88, 84, 100];
    const bars = data.map((d, i) => {
      const x = i * (100 / data.length) + 1.2;
      const w = 100 / data.length - 2.4;
      return `<rect x="${x}" y="${100 - d}" width="${w}" height="${d}" rx="1.6" fill="url(#bg)" opacity="${i === data.length - 1 ? 1 : .55 + i * .03}"/>`;
    }).join('');
    const pts = data.map((d, i) => `${i * (100 / data.length) + 50 / data.length},${100 - d * 0.82 - 6}`).join(' ');
    return `
    <div class="tile t-lap" style="grid-area:lap">
      <span class="eyebrow">${ic('chart')} Laporan</span>
      <div class="title">Tren klinik, <span style="white-space:nowrap">real-time.</span></div>
      <div class="lap-head">
        <div><div class="stat lbl" style="background:none;padding:0;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:6px">Pendapatan 12 bulan</div><span class="big">Rp1,86 M</span></div>
        <span class="delta">▲ 24% YoY</span>
      </div>
      <div class="chart">
        <svg viewBox="0 0 100 100" preserveAspectRatio="none">
          <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#7c7af7"/><stop offset="1" stop-color="#4f7ef8" stop-opacity=".55"/>
          </linearGradient></defs>
          ${bars}
          <polyline points="${pts}" fill="none" stroke="#a855f7" stroke-width="1.1" vector-effect="non-scaling-stroke" style="stroke-width:3px"/>
        </svg>
      </div>
      <div class="chips">
        <span class="chip">Per dokter</span><span class="chip">Per metode bayar</span>
        <span class="chip accent">${ic('download')} Export Excel</span>
      </div>
    </div>`;
  },

  res: () => `
    <div class="tile t-sm t-res-sm" style="grid-area:res">
      <div class="ico">${ic('calendar')}</div>
      <div><div class="k">Reservasi dari mana saja</div><div class="v">Website, dashboard & telepon</div></div>
    </div>`,

  resWide: () => `
    <div class="tile t-res" style="grid-area:res">
      <span class="eyebrow">${ic('calendar')} Reservasi</span>
      <div class="title">Booking dari mana saja.</div>
      <div class="grow"></div>
      <div class="sources">
        <div class="src">${ic('globe')}Website</div>
        <div class="src">${ic('monitor')}Dashboard</div>
        <div class="src">${ic('phone')}Telepon</div>
      </div>
    </div>`,

  tarif: (v) => `
    <div class="tile t-sm t-tarif" style="grid-area:tarif">
      ${v === 'short' ? '<span class="eyebrow" style="--accent:var(--pink)">' + ic('tag') + ' Tarif & Tindakan</span>' : `<div class="ico">${ic('tag')}</div>`}
      <div><div class="big">42%</div><div class="k" style="margin-top:6px">Margin otomatis</div><div class="v">Harga modal vs jual per tindakan</div></div>
    </div>`,

  fee: () => `
    <div class="tile t-sm t-fee" style="grid-area:fee">
      <div class="ico">${ic('dollar')}</div>
      <div><div class="k">Share fee dokter</div><div class="v">Fixed atau persentase, laporan bulanan otomatis</div></div>
    </div>`,

  role: () => `
    <div class="tile t-sm t-role" style="grid-area:role">
      <div class="ico">${ic('shield')}</div>
      <div><div class="k">Akses berbasis peran</div><div class="v">Owner · Admin · Dokter</div></div>
    </div>`,

  ops: () => `
    <div class="tile t-sm t-ops" style="grid-area:ops">
      <div class="ico">${ic('briefcase')}</div>
      <div><div class="k">Catat operasional</div><div class="v">Biaya bulanan per kategori</div></div>
    </div>`,
};

const LAYOUTS = {
  'ig-portrait': {
    w: 1080, h: 1350, cols: 4, rows: 6, header: true,
    rowTpl: '1fr 1fr 162px 1fr 1fr 146px',
    areas: [
      'sat sat dash dash',
      'sat sat dash dash',
      'pas pas pas pas',
      'bill bill lap lap',
      'bill bill lap lap',
      'res tarif fee role',
    ],
    tiles: ['sat:short', 'dash:short', 'pas:short', 'bill:narrow', 'lap', 'res', 'tarif:short', 'fee', 'role'],
  },
  'ig-square': {
    w: 1080, h: 1080, cols: 4, rows: 4,
    areas: [
      'hero hero sat sat',
      'hero hero sat sat',
      'dash dash bill lap',
      'dash dash bill lap',
    ],
    tiles: ['hero', 'sat', 'dash', 'bill:narrow', 'lap'],
  },
  'desktop': {
    w: 1920, h: 1080, cols: 6, rows: 4,
    areas: [
      'hero hero sat  sat  dash dash',
      'hero hero sat  sat  dash dash',
      'pas  pas  bill lap  lap  role',
      'tarif fee bill lap  lap  res',
    ],
    tiles: ['hero', 'sat', 'dash', 'pas', 'bill:narrow', 'lap', 'role', 'res', 'tarif', 'fee'],
  },
};

const params = new URLSearchParams(location.search);
const format = params.get('f') || 'ig-portrait';
const theme = params.get('theme') || 'light';
const L = LAYOUTS[format];
document.body.className = `f-${format} ${theme}`;
document.documentElement.style.setProperty('--w', L.w + 'px');
document.documentElement.style.setProperty('--h', L.h + 'px');

const canvas = document.getElementById('canvas');
let html = '';
if (L.header) {
  html += `
    <div class="header">
      <div class="brand"><div class="mark">${ic('activity')}</div>ApexRecord</div>
      <h1>Kelola klinik <span class="grad-text">lebih cerdas.</span></h1>
      <p>Rekam medis, reservasi, kasir & laporan klinik dalam satu platform.</p>
    </div>`;
}
html += `<div class="bento" style="--cols:${L.cols};--row-tpl:${L.rowTpl || `repeat(${L.rows}, minmax(0, 1fr))`};grid-template-areas:${L.areas.map((a) => `'${a}'`).join(' ')}">
  ${L.tiles.map((t) => { const [k, v] = t.split(':'); return T[k](v); }).join('')}
</div>`;
if (L.footer) {
  html += `<div class="footer"><span><b>ApexRecord</b> · Sistem Manajemen Klinik</span><span>Terintegrasi SATUSEHAT Kemenkes RI</span></div>`;
}
canvas.insertAdjacentHTML('beforeend', html);
</script>
</body>
</html>
